name: Build Windows wheel and attach to Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 MSYS2 及编译所需工具和 poppler
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-poppler
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      # 将 MSYS2 的 bin 目录加入 PATH，以便后续使用 pkg-config 等（虽然这里主要用 sed）
      - name: Add MSYS2 to PATH
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\usr\bin"   | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 设置 pkg-config 路径（保留，虽然后面直接改 pyproject.toml）
      - name: Set PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=C:\msys64\mingw64\lib\pkgconfig" >> $env:GITHUB_ENV

      # 使用 cibuildwheel 构建 wheel
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS: "auto64"

          # Windows 构建前修补 pyproject.toml，将 macOS 路径替换为 MSYS2 的 Mingw-w64 路径
          CIBW_BEFORE_BUILD_WINDOWS: |
            sed -i "s|include_dirs=\['/opt/homebrew/include', '/usr/local/include'\]|include_dirs=['C:/msys64/mingw64/include']|" pyproject.toml
            sed -i "s|library_dirs=\['/opt/homebrew/lib', '/usr/local/lib'\]|library_dirs=['C:/msys64/mingw64/lib']|" pyproject.toml

          # 可选：设置环境变量，确保编译器能识别 MSYS2 的库（但修改 pyproject.toml 已经足够）
          CIBW_ENVIRONMENT_WINDOWS: "PKG_CONFIG_PATH=C:/msys64/mingw64/lib/pkgconfig"

      # 将生成的 wheel 上传到 GitHub Release
      - name: Upload wheels to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./wheelhouse/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}