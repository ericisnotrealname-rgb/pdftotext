image: ubuntu/24.04
tasks:
 - deps: |
     sudo apt install --yes build-essential libpoppler-cpp-dev python3-dev python3-pip
 - install: |
     cd pdftotext
     pip install --break-system-packages --verbose --editable .
 - test: |
     cd pdftotext
     python3 -m unittest discover --verbose --start-directory tests
